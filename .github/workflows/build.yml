name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    # net8.0-windows の WinForms は Windows でしかビルドできない
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: build
        run: dotnet build tests/PasteFence.Tests/PasteFence.Tests.csproj -c Release --nologo

      - name: test
        # 自作ハーネス。全件通ると "PASS: N tests" を出して終了コード 0
        run: dotnet run --project tests/PasteFence.Tests/PasteFence.Tests.csproj -c Release --no-build

  publish:
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # .NET を入れていない人向け。単体で動くが約 68MB
      # （WinForms はトリミング非対応＝NETSDK1175 なので、これ以上は縮まない）
      - name: publish (self-contained)
        run: >
          dotnet publish src/PasteFence/PasteFence.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/standalone

      # .NET 8 デスクトップランタイムが入っている人向け。約 0.2MB
      - name: publish (needs .NET 8)
        run: >
          dotnet publish src/PasteFence/PasteFence.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -o publish/light

      - name: rename and show sizes
        shell: pwsh
        run: |
          Move-Item publish/standalone/PasteFence.exe publish/PasteFence.exe
          Move-Item publish/light/PasteFence.exe publish/PasteFence-needs-dotnet8.exe
          Get-ChildItem publish/*.exe |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

      - name: attach third-party notices
        shell: pwsh
        run: |
          # 自己完結型で配る以上、同梱した Microsoft 製ランタイムの通知を添える義務がある
          $src = Get-ChildItem -Path "$env:USERPROFILE\.nuget\packages" -Filter THIRD-PARTY-NOTICES.TXT -Recurse -ErrorAction SilentlyContinue |
                 Where-Object { $_.FullName -match 'microsoft\.(netcore|windowsdesktop)\.app\.runtime' } |
                 Select-Object -First 1
          if ($src) {
            Copy-Item $src.FullName publish/THIRD-PARTY-NOTICES.txt
          } else {
            Write-Error "THIRD-PARTY-NOTICES.TXT が見つかりません"
          }

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/PasteFence.exe
            publish/PasteFence-needs-dotnet8.exe
            publish/THIRD-PARTY-NOTICES.txt
            LICENSE
