name: icon-check

# 実行ファイルにアイコンが実際に埋まっているかを確かめる。
# Linux ではこの確認ができないので、Windows のランナーに任せている。
# リリース用の publish は build.yml 側（タグを打ったとき）にあるが、
# あちらはタグを打つまで走らないため、同じ publish をここで PR ごとに回す。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  icon:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # build.yml のリリース手順と同じ指定で発行する
      - name: publish (self-contained)
        run: >
          dotnet publish src/PasteFence/PasteFence.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/standalone

      - name: publish (needs .NET 8)
        run: >
          dotnet publish src/PasteFence/PasteFence.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -o publish/light

      - name: check embedded icon
        # Windows PowerShell 5.1 を使う。.NET Framework の System.Drawing が
        # 最初から入っていて、追加の取得が要らないため。
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Add-Type -AssemblyName System.Drawing

          # pastefence.ico で使っている 3 色。これが揃っていれば、
          # 既定のアイコンではなく PasteFence のアイコンが入っている。
          $navyRgb  = 0x1B3A5C
          $whiteRgb = 0xFFFFFF

          function Test-Exe([string]$path) {
            $full = (Resolve-Path $path).Path
            Write-Host "=== $full ==="

            $icon = [System.Drawing.Icon]::ExtractAssociatedIcon($full)
            if ($null -eq $icon) { throw "アイコンを取り出せませんでした: $full" }
            $bmp = $icon.ToBitmap()
            Write-Host ("  取り出した寸法: {0}x{1}" -f $bmp.Width, $bmp.Height)

            $navy = 0; $white = 0; $amber = 0
            for ($y = 0; $y -lt $bmp.Height; $y++) {
              for ($x = 0; $x -lt $bmp.Width; $x++) {
                $p = $bmp.GetPixel($x, $y)
                if ($p.A -lt 128) { continue }
                $rgb = ($p.R -shl 16) -bor ($p.G -shl 8) -bor $p.B
                if ($rgb -eq $navyRgb) { $navy++ }
                elseif ($rgb -eq $whiteRgb) { $white++ }
                # 琥珀色のクリップは面積が小さく縁がぼけるので幅を持たせて数える
                elseif ($p.R -gt 200 -and $p.G -gt 120 -and $p.G -lt 190 -and $p.B -lt 110) { $amber++ }
              }
            }
            Write-Host ("  紺 {0}px / 白 {1}px / 琥珀 {2}px" -f $navy, $white, $amber)

            if ($navy  -lt 1) { throw "紺色 #1B3A5C が無い。別のアイコンが入っている: $full" }
            if ($white -lt 1) { throw "白 #FFFFFF が無い。別のアイコンが入っている: $full" }
            if ($amber -lt 1) { throw "琥珀色のクリップが無い。別のアイコンが入っている: $full" }

            $bmp.Dispose(); $icon.Dispose()
          }

          Test-Exe 'publish/standalone/PasteFence.exe'
          Test-Exe 'publish/light/PasteFence.exe'
          Write-Host '2 つとも PasteFence のアイコンが埋まっている。'

      # エクスプローラーでの見た目は人の目でしか確かめられないので、
      # 落として確認できるように置いておく。
      - name: rename for upload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/out | Out-Null
          Copy-Item publish/standalone/PasteFence.exe publish/out/PasteFence.exe
          Copy-Item publish/light/PasteFence.exe publish/out/PasteFence-needs-dotnet8.exe
          Get-ChildItem publish/out/*.exe |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: pastefence-exe
          path: publish/out/*.exe
          retention-days: 7
