name: icon-check

# 実行ファイルにアイコンが実際に埋まっているかを確かめる。
# Linux ではこの確認ができないので、Windows のランナーに任せている。
# リリース用の publish は build.yml 側（タグを打ったとき）にあるが、
# あちらはタグを打つまで走らないため、同じ publish をここで PR ごとに回す。

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  icon:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # build.yml のリリース手順と同じ指定で発行する
      - name: publish (self-contained)
        run: >
          dotnet publish src/PasteFence/PasteFence.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/standalone

      - name: publish (needs .NET 8)
        run: >
          dotnet publish src/PasteFence/PasteFence.csproj
          -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true
          -o publish/light

      - name: check embedded icon
        # Windows PowerShell 5.1 を使う（.NET Framework の System.Drawing が
        # 最初から入っていて、追加の取得が要らないため）。
        #
        # 中身は assets/icon/check-embedded-icon.ps1 に置いてある。
        # ここに直接書くと、ランナーが作る .ps1 に BOM が付かず、
        # PowerShell 5.1 がそれを ANSI として読んで日本語が化け、構文エラーになる。
        # リポジトリ側のファイルは BOM 付きで保存してあるので化けない。
        # この run: は ASCII だけで書くこと。
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File assets\icon\check-embedded-icon.ps1 publish\standalone\PasteFence.exe publish\light\PasteFence.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # エクスプローラーでの見た目は人の目でしか確かめられないので、
      # 落として確認できるように置いておく。
      - name: rename for upload
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force publish/out | Out-Null
          Copy-Item publish/standalone/PasteFence.exe publish/out/PasteFence.exe
          Copy-Item publish/light/PasteFence.exe publish/out/PasteFence-needs-dotnet8.exe
          Get-ChildItem publish/out/*.exe |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}} |
            Format-Table -AutoSize

      - uses: actions/upload-artifact@v4
        with:
          name: pastefence-exe
          path: publish/out/*.exe
          retention-days: 7
